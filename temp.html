<!doctype html>
<html lang="en">
  <head>
    <title>KLSMC</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" href="/images/favicon.png" type="image/png" />
    <link
      href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Abril+Fatface&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="colorlib-page" style="margin-right: 15rem">
      <div id="colorlib-main" style="margin-right: 20rem">
        <section
          class="ftco-section ftco-no-pt ftco-no-pb"
          style="margin-left: 40%; margin-right: 30%; margin-top: 17rem"
        >
          <div class="login-container">
            <h2>Enter Password</h2>
            <input type="password" id="password" placeholder="Password" />
            <button onclick="submitPassword()">Submit</button>
          </div>
        </section>
      </div>
    </div>

    <script>
      function hexToBytes(hex) {
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < hex.length; i += 2)
          bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
        return bytes;
      }

      async function deriveKey(password) {
        const encoder = new TextEncoder();
        const hashBuffer = await crypto.subtle.digest(
          "SHA-256",
          encoder.encode(password),
        );
        return crypto.subtle.importKey("raw", hashBuffer, "AES-GCM", false, [
          "decrypt",
        ]);
      }

      async function decryptUrl(password, encryptedData) {
        const [ivHex, tagHex, cipherHex] = encryptedData.split(":");
        const iv = hexToBytes(ivHex);
        const tag = hexToBytes(tagHex);
        const ciphertext = hexToBytes(cipherHex);
        const combined = new Uint8Array(ciphertext.length + tag.length);
        combined.set(ciphertext);
        combined.set(tag, ciphertext.length);
        const key = await deriveKey(password);
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv: iv },
          key,
          combined,
        );
        return new TextDecoder().decode(decrypted);
      }

      // Encrypted redirect URLs (iv:authTag:ciphertext) — only decryptable with the correct password
      const encryptedRedirects = [
        "ba0a4ae8a63779e26e444b8a:c2a47ec7f2fc9bc942787df5f6f88d90:eb1a69acbe1ae57bced744",
      ];

      async function submitPassword() {
        const password = document.getElementById("password").value;
        for (const entry of encryptedRedirects) {
          try {
            const url = await decryptUrl(password, entry);
            window.location.href = url;
            return;
          } catch (e) {
            // Decryption failed — wrong password for this entry
          }
        }
        alert("Incorrect password!");
      }
    </script>
  </body>
</html>
