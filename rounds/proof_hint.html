    // --- Hint usage tracking (persists across sessions, per team) ---
    function getHintStorage() {
      try { return JSON.parse(localStorage.getItem('hintUsage')) || {}; } catch(e) { return {}; }
    }
    function saveHintStorage(data) {
      localStorage.setItem('hintUsage', JSON.stringify(data));
    }
    function getUsedHints(teamCode) {
      var storage = getHintStorage();
      return storage[teamCode] || [];
    }
    function markHintUsed(teamCode, hintId) {
      var storage = getHintStorage();
      if (!storage[teamCode]) storage[teamCode] = [];
      if (storage[teamCode].indexOf(hintId) === -1) storage[teamCode].push(hintId);
      saveHintStorage(storage);

    async function hashPassword(password) {
      const encoder = new TextEncoder();
      const data = encoder.encode(password);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function loadPageContent() {
      const template = document.getElementById('page-content');
      const main = document.getElementById('colorlib-main');
      main.appendChild(template.content.cloneNode(true));
      template.remove();
      // Load leaderboard after content is in the DOM
      fetch(
        "https://docs.google.com/spreadsheets/d/e/2PACX-1vTea1Hp5rkgRfh49dopeM58Q6F4qVSrZRQWIHmjPYYjabpf1hCtiB4_8waPVBgmMCjCbU5mn3fPb7II/pub?gid=1927463165&single=true&output=csv"
      )
        .then(function(response) { return response.text(); })
        .then(function(csv) {
          var lines = csv.split("\n");
          var result = [];
          for (var i = 1; i < lines.length; i++) {
            var currentline = lines[i].split(",").map(function(cell) { return cell.trim(); });
            if (currentline.length < 4 || !currentline[0] || isNaN(Number(currentline[3]))) continue;
            result.push({ teamID: currentline[0], total: Number(currentline[3]) });
          }
          result.sort(function(a, b) { return b.total - a.total; });
          var top15 = result.slice(0, 15);
          var tableBody = document.getElementById("leaderboardTable").getElementsByTagName("tbody")[0];
          tableBody.innerHTML = "";
          top15.forEach(function(row, index) {
            var tr = document.createElement("tr");
            tr.innerHTML = "<td>" + (index + 1) + "</td><td>" + row.teamID + "</td><td>" + row.total + "</td>";
            tableBody.appendChild(tr);
          });
        })
        .catch(function(error) { console.error("Error:", error); });

      var hintBtns = document.querySelectorAll('.hint-btn');
      hintBtns.forEach(function(btn) {
        var hintId = btn.getAttribute('data-hint');

        // If this team already used this hint, show tick immediately
        if (teamCode && isHintUsed(teamCode, hintId)) {
          btn.textContent = hintId + ' ✓';
          btn.disabled = true;
          btn.style.opacity = '0.7';
        }

        btn.addEventListener('click', function(e) {
          e.preventDefault();
          var teamCode = localStorage.getItem('teamCode');
          if (!teamCode) { alert('No team found. Please re-enter your password.'); return; }
          var hintId = btn.getAttribute('data-hint');
          var question = btn.getAttribute('data-question');

          // Already used — no server call, no point deduction, just open link
          if (isHintUsed(teamCode, hintId)) {
            console.log('[HINT] Hint', hintId, 'already used by', teamCode, '— no deduction.');
            btn.textContent = hintId + ' ✓';
            btn.style.opacity = '0.7';
            window.open(btn.href, '_blank');
            return;
          }

          var url = APPS_SCRIPT_URL + '?teamCode=' + encodeURIComponent(teamCode) + '&question=' + encodeURIComponent(question);
          console.log('[HINT DEBUG] Clicking hint:', hintId, 'question:', question);
          console.log('[HINT DEBUG] Team code:', teamCode);
          console.log('[HINT DEBUG] Request URL:', url);
          btn.disabled = true;
          btn.textContent = hintId + ' ...';
          fetch(url, { method: 'GET', redirect: 'follow' })
            .then(function(response) {
              console.log('[HINT DEBUG] Response status:', response.status);
              console.log('[HINT DEBUG] Response ok:', response.ok);
              return response.text();
            })
            .then(function(text) {
              console.log('[HINT DEBUG] Response body:', text);
              try {
                var data = JSON.parse(text);
                if (data.error) {
                  console.error('[HINT DEBUG] Server error:', data.error);
                  alert('Server error: ' + data.error);
                  btn.textContent = hintId;
                  btn.disabled = false;
                } else {
                  console.log('[HINT DEBUG] Success:', data);
                  markHintUsed(teamCode, hintId);
                  btn.textContent = hintId + ' ✓';
                  btn.style.opacity = '0.7';
                  window.open(btn.href, '_blank');
                }
              } catch(parseErr) {
                console.error('[HINT DEBUG] Failed to parse response:', parseErr, text);
                btn.textContent = hintId;
                btn.disabled = false;
              }
            })
            .catch(function(err) {
              console.error('[HINT DEBUG] Fetch failed:', err);
              btn.textContent = hintId;
              btn.disabled = false;
              alert('Failed to record hint usage: ' + err.message);
            });
        });
      });
    }

    async function verifyPassword() {
      const input = document.getElementById('team-password').value;
      const errorEl = document.getElementById('password-error');
      if (!input) { errorEl.style.display = 'block'; return; }
      const hashed = await hashPassword(input);
      if (PASSWORD_HASHES[hashed]) {
        localStorage.setItem('teamCode', PASSWORD_HASHES[hashed]);
        document.getElementById('password-gate').remove();
        loadPageContent();
        errorEl.style.display = 'none';
      } else {
        errorEl.style.display = 'block';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('password-submit').addEventListener('click', verifyPassword);
      document.getElementById('team-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') verifyPassword();
      });
    });

    // Purge Team Code when leaving the page
    window.addEventListener('pagehide', function() {
      localStorage.removeItem('teamCode');
